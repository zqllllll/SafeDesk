[project]
name = "agentgate-appworld"
version = "0.1.0"
description = "AppWorld benchmark adapter for SafeDesk AgentGate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentgate-core>=0.1.0,<0.2.0",
]

[project.scripts]
agentgate-appworld-convert = "agentgate_appworld.cli:main"
agentgate-appworld-shadow-audit = "agentgate_appworld.shadow_audit_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgate_appworld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
