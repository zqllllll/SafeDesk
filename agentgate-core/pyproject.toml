[project]
name = "agentgate-core"
version = "0.1.0"
description = "Framework-independent governance core for SafeDesk"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgate_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
