[project]
name = "agentgate-deerflow"
version = "0.1.0"
description = "DeerFlow adapter for the SafeDesk AgentGate core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentgate-core>=0.1.0,<0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgate_deerflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
